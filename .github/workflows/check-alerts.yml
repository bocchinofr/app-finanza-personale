name: Check Alerts

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC
    - cron: '0 16 * * *'  # 16:00 UTC
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama /api/check-alerts
        run: |
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            -X GET "${{ secrets.APP_URL }}/api/check-alerts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
