name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 8 */3 * *'   # ogni 3 giorni alle 08:00 UTC
  workflow_dispatch: {}      # permette run manuale da tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -w "\nHTTP_STATUS:%{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/profili?select=user_id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
