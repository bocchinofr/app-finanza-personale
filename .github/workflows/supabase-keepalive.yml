name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 8 */3 * *'   # ogni 3 giorni alle 08:00 UTC
  workflow_dispatch: {}      # permette run manuale da tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (write)
        run: |
          curl -s -w "\nHTTP_STATUS:%{http_code}\n" \
            -X PATCH "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive?id=eq.1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"last_ping": "now()"}'
